<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Project Hub</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1a1a1e;
      --text: #e1e1e6;
      --text-muted: #8d8d99;
      --accent: #4ade80;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    header {
      margin-bottom: 3rem;
      border-bottom: 1px solid #29292e;
      padding-bottom: 1.5rem;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2.25rem;
    }
    p {
      color: var(--text-muted);
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid #29292e;
      border-radius: 8px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card h2::after {
      content: "→";
      color: var(--accent);
      font-size: 1rem;
    }
    .card p {
      font-size: 0.9rem;
    }
    .loading, .error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>talex-tnt projects</h1>
    <p>A dynamically generated directory of my applications.</p>
  </header>

  <main class="grid" id="project-grid">
    <div class="loading" id="status-msg">Fetching directories from GitHub...</div>
  </main>

<script>
  async function loadProjects() {
    const grid = document.getElementById('project-grid');
    const statusMsg = document.getElementById('status-msg');

    const hostname = window.location.hostname;
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    
    // 1. Correctly extract your username from 'talex-tnt.github.io'
    let username = hostname.split('.')[0]; 
    let repo = '';

    // 2. Smart check: Is this a user page repository or a sub-folder project repository?
    if (hostname.endsWith('github.io')) {
      if (hostname === `${username}.github.io`) {
        // It's your root user repository (talex-tnt.github.io)
        repo = hostname; 
      } else {
        // It's a project repository (e.g., username.github.io/repo-name)
        repo = pathSegments[0] || '';
      }
    } else {
      // Hardcoded fallbacks if you are debugging locally or using a custom apex domain
      username = 'talex-tnt';
      repo = 'talex-tnt.github.io';
    }

    try {
      // This will now correctly call: https://api.github.com/repos/talex-tnt/talex-tnt.github.io/contents
      const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents`);
      if (!response.ok) throw new Error('Failed to fetch contents');
      
      const items = await response.json();
      
      // Filter out root files (like index.html) and hidden files, keeping only project directories
      const directories = items.filter(item => item.type === 'dir' && !item.name.startsWith('.'));

      if (directories.length === 0) {
        statusMsg.textContent = 'No sub-project directories found.';
        return;
      }

      // Clear the "Fetching..." text
      grid.innerHTML = '';

      // Render your folders beautifully
      directories.forEach(dir => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = `./${dir.name}/`;
        
        // Formats folder names (e.g., retro-collections-dev -> Retro Collections Dev)
        const cleanName = dir.name
          .split(/[-_]/)
          .map(word => word.charAt(0).toUpperCase() + word.slice(1))
          .join(' ');

        card.innerHTML = `
          <h2>${cleanName}</h2>
          <p>Explore the ${dir.name} application deployment.</p>
        `;
        grid.appendChild(card);
      });

    } catch (error) {
      console.error(error);
      statusMsg.className = 'error';
      statusMsg.textContent = 'Unable to dynamically load directories. Ensure this repository is public.';
    }
  }

  loadProjects();
</script>
</body>
</html>
